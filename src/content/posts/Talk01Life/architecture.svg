<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9573D"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A9AA8"/>
    </marker>
  </defs>

  <!-- C ↔ A1: 双向虚线"持续优化" -->
  <path d="M 400 170 L 400 110" stroke="#C9573D" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-red)" marker-start="url(#arrow-red)"/>
  <text x="412" y="142" font-size="11" fill="#C9573D">持续优化</text>

  <!-- C → B1 -->
  <path d="M 350 250 Q 230 290 180 330" stroke="#C9573D" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="220" y="298" font-size="10" fill="#C9573D">持续优化</text>

  <!-- C → B2 -->
  <path d="M 450 250 Q 570 290 620 330" stroke="#C9573D" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="560" y="298" font-size="10" fill="#C9573D">持续优化</text>

  <!-- C → D1 -->
  <path d="M 360 250 Q 320 400 285 540" stroke="#C9573D" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-red)" opacity="0.5"/>

  <!-- C → D2 -->
  <path d="M 440 250 Q 480 400 515 540" stroke="#C9573D" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-red)" opacity="0.5"/>

  <!-- A1 → B1 -->
  <path d="M 340 110 Q 240 220 180 330" stroke="#5A6B7B" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="220" font-size="10" fill="#5A6B7B">提供灵感和素材</text>

  <!-- A1 → B2 -->
  <path d="M 460 110 Q 560 220 620 330" stroke="#5A6B7B" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text x="540" y="220" font-size="10" fill="#5A6B7B">提供灵感和素材</text>

  <!-- B1 → A1 -->
  <path d="M 200 330 Q 260 220 350 110" stroke="#5A6B7B" stroke-width="1.2" fill="none" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- B2 → A1 -->
  <path d="M 600 330 Q 540 220 450 110" stroke="#5A6B7B" stroke-width="1.2" fill="none" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- B1 ↔ B2 -->
  <path d="M 300 375 L 500 375" stroke="#5A6B7B" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="350" y="368" font-size="10" fill="#5A6B7B">部分转化</text>

  <!-- D1 → B1 -->
  <path d="M 240 540 Q 200 480 180 420" stroke="#8A9AA8" stroke-width="1.2" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="120" y="490" font-size="10" fill="#8A9AA8">提供稳定基础</text>

  <!-- D1 → A1 -->
  <path d="M 285 540 Q 320 320 350 110" stroke="#8A9AA8" stroke-width="1" fill="none" marker-end="url(#arrow-gray)" opacity="0.4"/>

  <!-- D2 → B2 -->
  <path d="M 560 540 Q 600 480 620 420" stroke="#8A9AA8" stroke-width="1.2" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="660" y="490" font-size="10" fill="#8A9AA8">排除突发干扰</text>

  <!-- D2 → B1 -->
  <path d="M 450 540 Q 380 470 220 420" stroke="#8A9AA8" stroke-width="1" fill="none" marker-end="url(#arrow-gray)" opacity="0.4"/>

  <!-- A1 内容平台 -->
  <g>
    <rect x="290" y="30" width="220" height="80" rx="8" fill="#E8C9A0" stroke="#5A6B7B" stroke-width="1"/>
    <text x="400" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#5A6B7B">🌱 内容平台</text>
    <text x="400" y="86" text-anchor="middle" font-size="11" fill="#5A6B7B">记录 / 创作 / 出口</text>
  </g>

  <!-- C 体系升级 -->
  <g>
    <rect x="290" y="170" width="220" height="80" rx="8" fill="#C9573D" stroke="#C9573D" stroke-width="1"/>
    <text x="400" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#FBF7F0">🛠️ 体系升级</text>
    <text x="400" y="226" text-anchor="middle" font-size="11" fill="#FBF7F0">核心驱动</text>
  </g>

  <!-- B1 人生挑战 -->
  <g>
    <rect x="60" y="330" width="240" height="90" rx="8" fill="#5A6B7B" stroke="#5A6B7B" stroke-width="1"/>
    <text x="180" y="362" text-anchor="middle" font-size="15" font-weight="600" fill="#FBF7F0">🧩 人生挑战</text>
    <text x="180" y="386" text-anchor="middle" font-size="12" font-style="italic" fill="#E8C9A0" font-family="Georgia, serif">"Experience &amp; Connection"</text>
    <text x="180" y="406" text-anchor="middle" font-size="11" fill="#FBF7F0">体验与连接</text>
  </g>

  <!-- B2 核心工程 -->
  <g>
    <rect x="500" y="330" width="240" height="90" rx="8" fill="#5A6B7B" stroke="#5A6B7B" stroke-width="1"/>
    <text x="620" y="362" text-anchor="middle" font-size="15" font-weight="600" fill="#FBF7F0">🎯 核心工程</text>
    <text x="620" y="386" text-anchor="middle" font-size="12" font-style="italic" fill="#E8C9A0" font-family="Georgia, serif">"Thinking &amp; Building"</text>
    <text x="620" y="406" text-anchor="middle" font-size="11" fill="#FBF7F0">思考与实现</text>
  </g>

  <!-- D1 基盘维护 -->
  <g>
    <rect x="180" y="540" width="210" height="70" rx="8" fill="#8A9AA8" stroke="#8A9AA8" stroke-width="1"/>
    <text x="285" y="572" text-anchor="middle" font-size="14" font-weight="600" fill="#FBF7F0">⚓ 基盘维护</text>
    <text x="285" y="592" text-anchor="middle" font-size="11" fill="#FBF7F0">财富 · 健康</text>
  </g>

  <!-- D2 及时响应 -->
  <g>
    <rect x="410" y="540" width="210" height="70" rx="8" fill="#8A9AA8" stroke="#8A9AA8" stroke-width="1"/>
    <text x="515" y="572" text-anchor="middle" font-size="14" font-weight="600" fill="#FBF7F0">⚡ 及时响应</text>
    <text x="515" y="592" text-anchor="middle" font-size="11" fill="#FBF7F0">突发问题处置</text>
  </g>
</svg>
